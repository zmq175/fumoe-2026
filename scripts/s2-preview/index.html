<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>府萌 S2 · 素材预览</title>
<style>
:root{color-scheme:dark;--bg:#080d10;--surface:#131c21;--line:#2c3b43;--ink:#eef5f7;--muted:#a2b6c0;--cyan:#31cef4;--gold:#f0cb66}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Microsoft YaHei","PingFang SC",sans-serif}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}button{cursor:pointer;color:inherit}a{color:var(--cyan)}header{border-bottom:3px solid var(--cyan);padding:22px max(24px,calc((100vw - 1500px)/2));display:flex;align-items:center;gap:20px;background:#020608}.brand{font-weight:900;font-size:27px;letter-spacing:3px}.brand small{font-size:13px;letter-spacing:0;color:var(--cyan)}header p{color:var(--muted);margin:0}main{max-width:1500px;margin:auto;padding:32px 24px}h1{font-size:clamp(25px,4vw,42px);margin:0 0 8px}.lead{color:var(--muted);max-width:850px;margin:0}.summary{display:flex;flex-wrap:wrap;gap:26px;margin:22px 0}.summary b{font:700 26px ui-monospace,monospace;color:var(--cyan)}.summary span{color:var(--muted)}.tools{position:sticky;top:0;z-index:2;background:var(--bg);padding:16px 0;display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}input,select{background:var(--surface);border:1px solid #51616a;color:var(--ink);padding:10px 12px;border-radius:0}input{width:280px;max-width:100%}.results{color:var(--muted);margin:20px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.grid--match{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}.grid--match .art{height:auto;aspect-ratio:16/9}.card{padding:0;text-align:left;border:1px solid var(--line);background:var(--surface);transition:border-color .15s}.card:hover,.card:focus-visible{border-color:var(--cyan)}.art{height:300px;background:#0c1317;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.art img{max-width:100%;max-height:100%;object-fit:contain}.empty{color:var(--muted);padding:24px;text-align:center}.info{padding:14px}.game{color:var(--muted);font-size:12px}.info h2{font-size:20px;margin:3px 0 8px}.state{font-size:12px;color:var(--gold)}.skin{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}.badge{position:absolute;top:10px;left:10px;background:#121b20e8;border:1px solid var(--gold);color:var(--gold);padding:3px 8px;font-size:12px}.note{margin-top:32px;color:var(--muted);font-size:13px}dialog{background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:0;width:min(1260px,96vw);max-height:94dvh}dialog::backdrop{background:#000c}dialog .bar{padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.close,.step{border:1px solid #52646f;background:var(--surface);padding:8px 14px}.detail{display:grid;grid-template-columns:1.15fr 1fr;gap:28px;padding:24px}.full{height:66vh;background:#101a20;display:flex;align-items:center;justify-content:center}.full img{width:100%;height:100%;object-fit:contain}.detail h2{margin:0;font-size:28px}.detail h3{font-size:15px;margin:24px 0 10px}.match{height:220px;background:#101a20;display:flex;justify-content:center;overflow:hidden}.match img{width:100%;height:100%;object-fit:contain}.metadata{word-break:break-word;color:var(--muted);font-size:14px}.metadata dt{color:var(--ink);margin-top:16px}.metadata dd{margin:3px 0 0}.variants{display:flex;flex-wrap:wrap;gap:8px}.variants a{font-size:12px;border:1px solid var(--line);padding:6px 8px;max-width:100%}.controls{display:flex;gap:8px}.status-note{border-left:3px solid var(--gold);padding:8px 12px;background:var(--surface);color:#e3d3a6;font-size:13px}@media(max-width:650px){header{padding:16px;align-items:flex-start;flex-direction:column;gap:4px}main{padding:24px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.art{height:240px}.info{padding:10px}.info h2{font-size:17px}.tools{gap:8px}input{width:100%}select{flex:1;min-width:0}.detail{grid-template-columns:1fr;padding:16px}.full{height:55vh}.summary{gap:14px}dialog .bar{padding:12px}.lead{font-size:14px}}
.grid--avatar .art{height:180px}.grid--avatar .art img{width:144px;height:144px}.avatar-sizes{display:flex;align-items:end;gap:18px;margin:18px 0}.avatar-sizes img{object-fit:contain;background:#101a20;border:1px solid var(--line)}.avatar-sizes figure{margin:0;text-align:center;color:var(--muted);font-size:12px}.art.ai{background:#15252c}.comparison{display:flex;gap:12px;align-items:center;margin:12px 0}.comparison img{width:96px;height:128px;object-fit:contain;background:#101a20}.grid--duel{display:block}.duel{border:1px solid var(--line);padding:16px;margin-bottom:24px}.duel-title{font-size:12px;color:var(--muted);margin-bottom:12px}.duel-pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}.duel .art{height:auto;aspect-ratio:16/9}.duel .art img,.duel .art picture,.match picture{width:100%;height:100%;object-fit:contain}.duel .card:nth-child(2) .info{text-align:right}@media(max-width:650px){.duel{padding:8px}.duel-pair{gap:8px}.duel .art{aspect-ratio:1}.duel .info h2{font-size:15px}} .art picture{display:block;width:100%;height:100%}.art picture img{width:100%;height:100%;object-fit:contain}</style>
<header><div class="brand">府萌 <small>S2 / 素材准备</small></div><p>独立预览 · 未发布 · 不影响 S1</p></header>
<main><h1>S2 角色素材预览</h1><p class="lead">256 位参赛角色按游戏分别归档。点击立绘查看大图、对局展示、头像和来源。全部 256 位均纳入处理范围。小头像参照证件照式透明胸像，支持双人对局卡和实际小尺寸预览；已导出素材仍需逐图复核。素材截止日期为 2026 年 11 月 4 日；候选图片不等于已经核实的最新皮肤。</p><div class="summary" id="summary"></div><div class="tools"><input type="search" id="search" placeholder="搜索角色、游戏或素材名称" aria-label="搜索角色"><select id="game" aria-label="筛选游戏"><option value="">全部游戏</option></select><select id="view" aria-label="展示构图"><option value="gallery">完整立绘</option><option value="source">原始素材（未验收）</option><option value="match">对局构图</option><option value="avatar">小头像</option><option value="duel">双人对局卡</option></select><select id="status" aria-label="筛选状态"><option value="">全部状态</option><option value="candidate">已找到候选</option><option value="legacy-reference">S1 参考副本</option><option value="pending">仍在补齐</option><option value="ai">AI 规整样例</option><option value="supplement">本次补齐的 21 位</option><option value="composed">已导出胸像</option><option value="cleanup">尚待处理</option><option value="audit-repaired">本轮重新提取的 9 位</option><option value="visual-issues">视觉问题清单</option><option value="cleaned">本批立绘返工</option><option value="repaired">已返工胸像</option></select></div><p class="results" id="results" role="status">正在读取素材…</p><div class="grid" id="grid"></div><p class="note">来源为游戏官网及角色资料站收录的游戏素材，版权归各权利人所有。本页仅供非商业赛事准备与构图预览；未核验的素材不能发布到正式赛季。</p></main>
<dialog id="detail" aria-labelledby="detail-heading"><div class="bar"><strong id="detail-heading">角色素材</strong><div class="controls"><button class="step" id="prev" aria-label="上一位角色">←</button><button class="step" id="next" aria-label="下一位角色">→</button><button class="close" id="close">关闭</button></div></div><div id="detail-body"></div></dialog>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let entries=[],filtered=[],active=0;const labels={candidate:'候选 · 最新皮肤待核验','legacy-reference':'S1 副本 · 尚待替换',pending:'素材待补齐'};
const artwork=e=>e.processedArtwork??e.aiArtwork;
function currentSource(e){return e.processedArtwork?.candidateSource??e.selected}
function avatar(e){if(e.avatarReview?.status==='rejected')return null;return e.portraitArtwork?.avatarImage??e.processedArtwork?.avatarImage??e.aiArtwork?.avatarImage??null}
function visualIssue(e,variant){
 if(variant==='source'||variant==='avatar')return '';
 const status=variant==='match'?e.visualAudit?.matchStatus:e.visualAudit?.galleryStatus;
 if(!artwork(e)||status==='needs-processing')return '人物素材尚未处理 · 原始场景仅在「原始素材」中查看';
 if(status==='needs-cleanup')return '人物背景仍需清理 · 已撤回返工，原始素材可对照';
 return '';
}
function img(e,variant='gallery',original=false){
 const raw=original||variant==='source',issue=!raw&&visualIssue(e,variant);
 if(issue)return `<div class="empty">${esc(issue)}</div>`;
 const supplied=raw&&currentSource(e)?.localOriginal;
 const art=raw?(supplied?{image:supplied,detailImage:supplied}:e):artwork(e);
 const url=variant==='avatar'?avatar(e):variant==='detail'?art?.detailImage??art?.image:variant==='match'?art?.matchImage:art?.image;
 if(variant==='match'&&art?.mobileImage)return `<picture><source media="(max-width:650px)" srcset="${esc(art.mobileImage)}"><img src="${esc(url)}" alt="${esc(e.name)}对局立绘" loading="lazy"></picture>`;
 return url?`<img src="${esc(url)}" alt="${esc(e.game+' · '+e.name)}" loading="lazy">`:'<div class="empty">'+(variant==='avatar'?'胸像待处理或返工':'人物素材尚待处理')+'</div>';
}
function visualNote(e){const v=$('view').value;if(v==='source')return '原始候选 · 未处理，不代表验收通过';if(v!=='avatar'){const issue=visualIssue(e,v==='duel'?'match':v);if(issue)return issue;if(e.visualAudit?.galleryStatus==='repaired-candidate'&&v==='gallery')return '立绘已重新提取 · 待最终复核';if(e.visualAudit?.galleryStatus==='partial-source'&&v==='gallery')return '保留原画范围 · 半身或截断原图';if(e.visualAudit?.matchStatus==='reframed-candidate'&&(v==='match'||v==='duel'))return '已重排头顶留白与眼线 · 待复核';}return '';}


function render(){$('grid').classList.toggle('grid--duel',$('view').value==='duel');$('grid').classList.toggle('grid--avatar',$('view').value==='avatar');$('grid').classList.toggle('grid--match',$('view').value==='match');const q=$('search').value.trim().toLowerCase();filtered=entries.filter(e=>(!$('game').value||e.game===$('game').value)&&(!$('status').value||($('status').value==='audit-repaired'?e.processedArtwork?.cleanupBatch==='visual-audit-v2':$('status').value==='visual-issues'?Boolean(e.visualAudit?.openIssues?.length):$('status').value==='cleaned'?Boolean(e.processedArtwork?.cleanupBatch):$('status').value==='ai'?Boolean(e.aiArtwork):$('status').value==='supplement'?Boolean(e.supplementBatch):$('status').value==='composed'?Boolean(avatar(e)):$('status').value==='cleanup'?!avatar(e):$('status').value==='repaired'?e.avatarReview?.status==='repaired':e.status===$('status').value))&&(!q||[e.name,e.game,currentSource(e)?.title].join(' ').toLowerCase().includes(q)));$('results').textContent=`显示 ${filtered.length} / ${entries.length} 位角色`;if($('view').value==='duel'){renderDuels();return}$('grid').innerHTML=filtered.map((e,i)=>`<button class="card" data-index="${i}" aria-label="查看${esc(e.game+' · '+e.name)}"><div class="art">${img(e,$('view').value)}${e.id==='c105'?'<span class="badge">♛ 卫冕冠军</span>':''}</div><div class="info"><div class="game">${esc(e.game)}</div><h2>${esc(e.name)}</h2><div class="state">${visualNote(e)|| (e.avatarReview?.status==='rejected'?'胸像不合格 · 已撤下返工':e.avatarReview?.status==='repaired'?'胸像已返工 · 独立人物轮廓':e.processedArtwork?(e.processedArtwork.method==='gpt-image'?'AI 提取背景 · 已导出待复核':'原图透明 · 已导出待复核'):e.aiArtwork?'AI 规整样例 · 尚待细节复核':labels[e.status])}</div><div class="skin">${esc(currentSource(e)?.title?.replace(/^文件:/,'')??'暂缺可靠图片')}</div></div></button>`).join('');}
function renderDuels(){let html='';for(let i=0;i<filtered.length;i+=2){const pair=filtered.slice(i,i+2);html+=`<article class="duel"><div class="duel-title">构图预览 · 不代表正式抽签</div><div class="duel-pair">${pair.map((e,j)=>`<button class="card" data-index="${i+j}"><div class="art">${img(e,'match')}</div><div class="info"><div class="game">${esc(e.game)}</div><h2>${esc(e.name)}</h2></div></button>`).join('')}</div></article>`}$('grid').innerHTML=html}

function show(i){active=(i+filtered.length)%filtered.length;const e=filtered[active];$('detail-heading').textContent=e.game+' · '+e.name;$('detail-body').innerHTML=`<div class="detail"><div><div class="full">${img(e,'detail')}</div>${e.image?`<p><a href="${esc(artwork(e)?.detailImage??e.detailImage??e.image)}" target="_blank" rel="noopener">单独打开大图 ↗</a></p>`:''}</div><div><div class="game">${esc(e.game)}</div><h2>${esc(e.name)}</h2><p class="status-note">${artwork(e)?esc(artwork(e).review)+'<br>':''}${esc(visualNote(e))}<br>${esc(e.issues.join('；')||labels[e.status])}</p>${artwork(e)&&avatar(e)?`<h3>原图对照</h3><div class="comparison">${img(e,'detail',true)}<a href="${esc(currentSource(e)?.localOriginal??e.original)}" target="_blank" rel="noopener">打开未处理原图 ↗</a></div><h3>小头像 · 线上实际容器</h3><div class="avatar-sizes">${[[58,70,'积分榜'],[42,44,'淘汰赛'],[42,48,'历史']].map(([w,h,label])=>`<figure><img style="object-position:50% 100%" src="${esc(avatar(e))}" width="${w}" height="${h}" alt="${esc(e.name)}头像"><figcaption>${label} ${w}×${h}</figcaption></figure>`).join('')}</div>`:''}${e.portraitArtwork&&avatar(e)?`<h3>仅限小头像的原画素材</h3><p>${esc(e.portraitArtwork.review)}</p><div class="avatar-sizes">${[[58,70],[42,44],[42,48]].map(([w,h])=>`<img src="${esc(e.portraitArtwork.avatarImage)}" width="${w}" height="${h}" alt="${esc(e.name)}头像">`).join('')}</div>`:''}<h3>横向对局容器预览</h3><div class="match">${img(e,'match')}</div><p class="metadata">${artwork(e)?'已导出候选（未完成视觉验收）：900 × 1200 立绘、512 × 512 头像；头像需通过独立人物轮廓复核，保留四边留白；对局单独按脸宽和眼线定位。':'尚未生成合格人物素材；不会使用原始场景图代替对局构图。'}</p><dl class="metadata"><dt>当前素材</dt><dd>${esc(currentSource(e)?.title??'暂无')}</dd><dt>来源记录</dt><dd>${currentSource(e)?.sourcePage?`<a href="${esc(currentSource(e).sourcePage)}" target="_blank" rel="noopener">查看角色 / 文件来源 ↗</a>`:'正在查找'}</dd><dt>最新皮肤核验</dt><dd>${e.latestVerified?'已核验':'未完成；不会自动标记为最新或正式发布'}</dd><dt>原图尺寸</dt><dd>${e.dimensions?e.dimensions.width+' × '+e.dimensions.height:'—'}</dd></dl>${e.candidates.length>1?'<h3>其他素材候选</h3><div class="variants">'+e.candidates.slice(1).map(c=>`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title.replace(/^文件:/,''))}</a>`).join('')+'</div>':''}</div></div>`;if(!$('detail').open)$('detail').showModal();$('detail').scrollTop=0;}
$('grid').addEventListener('click',ev=>{const b=ev.target.closest('[data-index]');if(b)show(Number(b.dataset.index))});for(const id of ['search','game','status','view'])$(id).addEventListener('input',render);$('close').onclick=()=>$('detail').close();$('prev').onclick=()=>show(active-1);$('next').onclick=()=>show(active+1);$('detail').addEventListener('click',e=>{if(e.target===$('detail')){const r=$('detail').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('detail').close()}});
Promise.all(['manifest.json','visual-audit.json'].map(url=>fetch(url).then(r=>{if(!r.ok)throw Error('目录不可用：'+url);return r.json()}))).then(([data,audit])=>{entries=data.entries.map(e=>({...e,visualAudit:audit.entries.find(r=>r.id===e.id&&r.game===e.game)}));for(const game of new Set(entries.map(e=>e.game))){const option=document.createElement('option');option.value=game;option.textContent=game;$('game').append(option)}const params=new URLSearchParams(location.search);if(['ai','supplement','composed','cleanup','repaired','cleaned','visual-issues','audit-repaired'].includes(params.get('status')))$('status').value=params.get('status');if(['gallery','match','avatar','duel','source'].includes(params.get('view')))$('view').value=params.get('view');const initialGame=params.get('game');if(initialGame&&entries.some(e=>e.game===initialGame))$('game').value=initialGame;$('summary').innerHTML=`<span><b>${entries.length}</b> 位角色</span><span><b>${entries.filter(e=>e.processedArtwork?.galleryKind==='full').length}</b> 全身候选（未验收）</span><span><b>${entries.filter(e=>e.visualAudit?.galleryStatus==='partial-source').length}</b> 半身或截断来源</span><span><b>${entries.filter(e=>!e.processedArtwork).length}</b> 尚未处理</span><span><b>${entries.filter(e=>avatar(e)).length}</b> 已导出新版头像</span><span><b>${entries.filter(e=>!avatar(e)).length}</b> 待处理头像</span>`;render()}).catch(e=>{$('results').textContent='素材目录读取失败：'+e.message});
</script></html>
